schema_version: "1"

# ===========================================================================
# Confluence playbook — capability plugin of kind `tool` (spec 2042 §5.10,
# ADR-0014). It owns no credentials: it rides on @omadia/integration-confluence
# and registers that integration's `confluence.toolkit` tools via
# ctx.tools.register. No persona and no model loop of its own; the former
# persona ships as the agent templates below. The id keeps its historical
# `agent-` prefix because installed instances reference it.
# ===========================================================================

identity:
  id: "@omadia/agent-confluence"
  kind: "tool"
  domain: "confluence"
  name: "Confluence Playbook Tools"
  version: "0.5.0"
  description:
    en: "Confluence playbook tools for internal processes, policies, onboarding, OKRs and runbooks: CQL search and page read in the configured space. Read-only by default; with confluence_write_enabled it can also stage pages, updates and comments, always as drafts and only after the user confirmed a preview."
    de: "Confluence-Playbook-Tools für interne Prozesse, Richtlinien, Onboarding, OKRs und Runbooks: CQL-Suche und Seiten lesen im konfigurierten Space. Standardmäßig nur lesend; mit confluence_write_enabled lassen sich zusätzlich Seiten, Änderungen und Kommentare vorbereiten, immer als Entwurf und erst nach Bestätigung einer Vorschau."
  authors:
    - name: "byte5 GmbH"
      email: "dev@byte5.de"
  license: "MIT"
  categories:
    - "knowledge"
    - "productivity"

compat:
  # 1.75.0: kind `tool`, `agent_templates` and `capabilities[].side_effects`
  # do not load on older cores (spec 2042 §5.10). It also covers 'teams-sso'
  # (plugin-api 1.51.0, omadia#1620).
  core: ">=1.75.0 <2.0"
  node: ">=20"

# Consumes 'confluence.toolkit' published by @omadia/integration-confluence —
# the tools (confluence_search/get_page/get_children/etc.) this plugin registers.
depends_on:
  - "@omadia/integration-confluence"

# omadia#839 — both services are resolved via `ctx.services.get` in activate()
# with an unconditional throw when absent. They are declared under
# `optional_requires:` rather than `requires:` for one concrete reason: their
# provider, `@omadia/integration-confluence`, publishes them at runtime via
# `ctx.services.provide` but its manifest still carries `provides: []` (it is
# outside the scope of this change and ships from its own repo). A `requires:`
# entry naming an undeclared capability is permanently unresolved, and an
# unresolved `requires:` drops this agent from the eligible set — it would
# never activate. `optional_requires:` grants exactly the declaration the
# service gate asks for without a resolver edge; `depends_on` above still
# guarantees the integration activates first, and this agent's own
# `services.get` null-check stays the failure mode if the toolkit is genuinely
# absent. Retires the `@omadia/agent-confluence` row in
# `STANDALONE_LEGACY_SERVICE_GRANTS_2026_08_20`.
optional_requires:
  - "confluence.client@1"
  - "confluence.toolkit@1"

lifecycle:
  entry: "dist/plugin.js"
  hooks:
    onInstall: false
    onConfigure: true
    onActivate: true
    onDeactivate: true
    onUninstall: true
  uninstall_policy:
    entities: "quarantine"
    memory: "delete"
    secrets: "delete"

setup:
  fields: []
  self_test: true

# One entry per registered tool: `id` is the tool name, `side_effects` what it
# does to Confluence. The three stage tools only read (they fetch the page and
# stage a preview in memory); only the commit changes Confluence.
capabilities:
  - id: "confluence_search"
    description: "Search pages of the configured space via CQL (scope is added server-side)."
    side_effects: "read"
  - id: "confluence_get_page"
    description: "Fetch one page by numeric id (rendered HTML and version metadata via expand)."
    side_effects: "read"
  - id: "confluence_get_page_by_title"
    description: "Look up a page by exact title in the configured space."
    side_effects: "read"
  - id: "confluence_get_children"
    description: "List the child pages of a page."
    side_effects: "read"
  - id: "confluence_get_space"
    description: "Return metadata (key, name) of the configured space."
    side_effects: "read"
  - id: "confluence_create_page"
    description: "Stage a new page (draft) and return a preview plus write token; writes nothing until committed. Only present with confluence_write_enabled."
    side_effects: "read"
  - id: "confluence_update_page"
    description: "Stage an update of a page and return a preview plus write token; writes nothing until committed. Only present with confluence_write_enabled."
    side_effects: "read"
  - id: "confluence_add_comment"
    description: "Stage a footer comment on a page and return a preview plus write token; writes nothing until committed. Only present with confluence_write_enabled."
    side_effects: "read"
  - id: "confluence_commit_write"
    description: "Execute a previously staged write (draft page, draft update or comment) after the user confirmed the preview. Only present with confluence_write_enabled."
    side_effects: "write"

# Which tools exist, and the CQL / expand / answer rules, is in the tool
# descriptions. This block tells an agent when to reach for the plugin.
playbook:
  when_to_use: |
    Confluence playbook of the configured space: internal processes, policies,
    onboarding, OKRs, runbooks, meeting notes, handbook content, "how do we
    do X". Full-text search via CQL, returns page title, link and last-updated
    date. The scope is hard-locked to the space configured in
    integration-confluence. With confluence_write_enabled it can also stage a
    new page, a page update or a comment; each write needs the user's explicit
    confirmation of a preview and is saved as a draft.
  not_for:
    - "External sources (web, third-party wikis)"
    - "Confluence spaces outside the configured scope"
    - "Deleting, moving or labelling pages (no such tool)"
    - "Writing without confluence_write_enabled or without user confirmation"
  example_prompts:
    - "What is the onboarding process for new employees?"
    - "Find all OKR pages for Q2."
    - "What does the incident response runbook say?"
    - "Create a new page 'Q3 OKRs' under the OKR overview."

permissions:
  graph:
    reads: []
    writes: []
  network:
    outbound: []
  filesystem:
    scratch: false
  # byte5ai/omadia#1620 — Teams-tab surface: a data-free shell ('public') and
  # the dashboards behind the kernel's 'teams-sso' mode, both under this one
  # entry. Served only after the operator grants it. The browser pages at
  # /p/agent-confluence/<page> stay behind the omadia session.
  public_paths:
    - "/p/agent-confluence/teams"

integrations: []

ui:
  settings_schema: null
  commands: []
  dashboard_cards: []

# Inactive presets (spec 2042 §5.10): the former persona of this package. An
# operator turns a template into an agent in the Agent Builder and grants the
# suggested capabilities there; installing this plugin creates no agent and
# grants nothing. One template per language.
agent_templates:
  - id: "playbook-assistant"
    name: "Playbook Assistant"
    short_description: "Answers questions from the Confluence playbook, with sources."
    long_description: >-
      A knowledge assistant for the company playbook in Confluence: internal
      processes, policies, onboarding, OKRs and runbooks of the configured
      space. It searches, reads and summarizes pages and always names the
      source. With write access enabled it can prepare pages and comments as
      drafts after the user confirmed a preview.
    language: "en"
    verbosity: "standard"
    instructions: |
      You are a knowledge assistant for the organization's Confluence
      playbook, strictly scoped to the one space the Confluence integration
      is configured for. The audience is the internal, pre-authorized
      executive circle; content of the space is internal-public for them, so
      no extra data-protection caution on process documentation.

      - Search wide first (about 10 hits), then fetch the 1-3 most relevant
        pages and summarize them. For ambiguous questions list the hits and
        let the user choose before going deeper.
      - Every answer that quotes or summarizes a page names the title, a
        working link and the last-updated date (`Stand: YYYY-MM-DD`). Never
        say "I know" without a source. Mention content older than 12 months.
      - Paraphrase instead of long quotes; use lists or tables for processes
        and checklists. Long pages: summarize the first part and say there is
        more.
      - Only the configured space is accessible. Name the real space (look it
        up with `confluence_get_space`), never a guessed one. For anything
        outside the playbook (HR data, accounting, customer projects), say so
        and point to the right place.
      - Writes (only when the write tools exist): stage first, show the
        preview, commit only after an explicit yes. Say afterwards that the
        result is a draft to be reviewed and published in Confluence.
        Deleting, moving and labelling pages is impossible. Without write
        tools you are read-only.
      - Never output secrets or tokens. On errors report the Confluence
        message in plain words, at most twice, and never try a write as a
        workaround.
    capabilities:
      - "@omadia/agent-confluence"

  - id: "playbook-assistant-de"
    name: "Playbook-Assistent"
    short_description: "Beantwortet Fragen aus dem Confluence-Playbook, mit Quellen."
    long_description: >-
      Ein Wissensassistent für das Firmen-Playbook in Confluence: interne
      Prozesse, Richtlinien, Onboarding, OKRs und Runbooks des konfigurierten
      Spaces. Er sucht, liest und fasst Seiten zusammen und nennt immer die
      Quelle. Mit aktiviertem Schreibzugriff bereitet er Seiten und Kommentare
      als Entwurf vor, nachdem der Nutzer eine Vorschau bestätigt hat.
    language: "de"
    verbosity: "standard"
    instructions: |
      Du bist ein Wissensassistent für das Confluence-Playbook der
      Organisation, strikt begrenzt auf den einen Space, für den die
      Confluence-Integration konfiguriert ist. Das Publikum ist der interne,
      vorab autorisierte Führungskreis; Inhalte des Spaces gelten für ihn als
      intern öffentlich, bei Prozessdokumentation ist keine zusätzliche
      Datenschutz-Vorsicht nötig.

      - Such zuerst breit (etwa 10 Treffer), hol dann die 1-3 relevantesten
        Seiten und fasse sie zusammen. Bei mehrdeutigen Fragen liste erst die
        Treffer und lass den Nutzer wählen, bevor du vertiefst.
      - Jede Antwort, die eine Seite zitiert oder zusammenfasst, nennt Titel,
        einen funktionierenden Link und das Stand-Datum (`Stand: YYYY-MM-DD`).
        Nie „weiß ich“ ohne Beleg. Erwähne Inhalte, die älter als 12 Monate
        sind.
      - Paraphrasiere statt lange zu zitieren; bei Prozessen und Checklisten
        Listen oder Tabellen. Bei langen Seiten fass den ersten Teil
        zusammen und sag, dass es mehr gibt.
      - Nur der konfigurierte Space ist erreichbar. Nenne den echten Space
        (mit `confluence_get_space` nachschlagen), nie einen geratenen. Bei
        allem außerhalb des Playbooks (HR-Daten, Buchhaltung, Kundenprojekte)
        sag das und verweise an die richtige Stelle.
      - Schreiben (nur wenn die Schreib-Tools vorhanden sind): erst vorbereiten,
        Vorschau zeigen, nur nach ausdrücklichem Ja committen. Sag danach, dass
        das Ergebnis ein Entwurf ist, der in Confluence geprüft und
        veröffentlicht werden muss. Löschen, Verschieben und Labeln ist nicht
        möglich. Ohne Schreib-Tools bist du strikt lesend.
      - Gib nie Geheimnisse oder Tokens aus. Bei Fehlern berichte die
        Confluence-Meldung in einfachen Worten, höchstens zweimal, und
        versuche nie einen Schreibzugriff als Umweg.
    capabilities:
      - "@omadia/agent-confluence"
